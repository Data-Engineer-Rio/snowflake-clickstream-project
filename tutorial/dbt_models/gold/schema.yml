version: 2

sources:
  - name: governance
    database: ABC_RETAIL
    schema: GOVERNANCE
    tables:
      - name: quarantine_records

models:
  - name: dim_date
    description: One row per calendar date covering all dates present in the curated Silver sources.
    columns:
      - name: date_key
        data_tests: [not_null, unique]
      - name: calendar_date
        data_tests: [not_null, unique]

  - name: dim_customer
    description: Customer SCD Type 2 timeline including CDC delete tombstones and one stable unknown member.
    columns:
      - name: customer_key
        data_tests: [not_null, unique]
      - name: user_id
        data_tests: [not_null]
      - name: effective_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]
      - name: is_deleted
        data_tests: [not_null]

  - name: dim_product
    description: Denormalized SCD Type 1 product dimension with category and subcategory attributes.
    columns:
      - name: product_key
        data_tests: [not_null, unique]
      - name: sku
        data_tests: [not_null, unique]
      - name: unit_cost_usd
        data_tests: [not_null]

  - name: dim_geography
    description: Conformed country dimension with a stable unknown member.
    columns:
      - name: geography_key
        data_tests: [not_null, unique]
      - name: country_code
        data_tests: [not_null, unique]

  - name: fact_customer_event
    description: Transaction fact at one row per clickstream event_id.
    columns:
      - name: customer_event_key
        data_tests: [not_null, unique]
      - name: event_id
        data_tests: [not_null, unique]
      - name: event_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: analytic_user_id
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              values: ['view', 'add_to_cart', 'checkout', 'purchase']

  - name: fact_order_line
    description: Transaction fact at one row per current non-deleted order line, valued in original currency and USD.
    columns:
      - name: order_line_key
        data_tests: [not_null, unique]
      - name: order_id
        data_tests: [not_null]
      - name: line_number
        data_tests: [not_null]
      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geography')
              field: geography_key
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['created', 'paid', 'shipped', 'cancelled', 'returned']
      - name: qty
        data_tests: [not_null]
      - name: gross_revenue_usd
        description: Null only when the required FX rate is missing; see is_fx_rate_missing.

  - name: fact_order_status
    description: Transaction fact at one row per order status or delete event.
    columns:
      - name: order_status_key
        data_tests: [not_null, unique]
      - name: status_event_id
        data_tests: [not_null, unique]
      - name: status_date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: geography_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geography')
              field: geography_key
      - name: status
        data_tests:
          - accepted_values:
              values: ['created', 'paid', 'shipped', 'cancelled', 'returned', 'deleted']

  - name: mart_daily_funnel
    description: Daily funnel by device OS using user_id or anonymous session identity.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: report_date
        data_tests: [not_null]
      - name: device_os
        data_tests: [not_null]

  - name: mart_revenue_daily
    description: Daily gross and net revenue at date-country-category grain.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: report_date
        data_tests: [not_null]
      - name: country_code
        data_tests: [not_null]
      - name: category_code
        data_tests: [not_null]
      - name: gross_revenue_usd
        data_tests: [not_null]
      - name: net_revenue_usd
        data_tests: [not_null]

  - name: mart_customer_360
    description: One current row per real customer with profile, order, revenue, device and feedback metrics.
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: user_id
        data_tests: [not_null, unique]
      - name: total_orders
        data_tests: [not_null]
      - name: lifetime_revenue_usd
        data_tests: [not_null]

  - name: mart_data_quality_daily
    description: Daily curated record and quality issue counts by source and error code.
    columns:
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: metric_date
        data_tests: [not_null]
      - name: source_name
        data_tests: [not_null]
      - name: record_status
        data_tests:
          - accepted_values:
              values: ['CURATED', 'QUALITY_ISSUE']
      - name: error_code
        data_tests: [not_null]
      - name: record_count
        data_tests: [not_null]
